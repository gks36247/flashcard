<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024년 전기설비기술기준 퀴즈</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e9ecef;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            font-weight: bold;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #4a90e2;
            color: white;
        }

        .quiz-container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            min-height: 400px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .question-text {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1em;
            color: #495057;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover { background-color: #e2e6ea; }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }

        .feedback-area {
            margin-top: 20px;
            display: none;
            padding: 15px;
            border-radius: 10px;
            background: #f1f3f5;
        }
        .next-btn {
            margin-top: 15px;
            padding: 12px 40px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="tab-container">
        <button class="tab-btn active" onclick="changeTab(0)">24년 1회차</button>
        <button class="tab-btn" onclick="changeTab(1)">24년 2회차</button>
        <button class="tab-btn" onclick="changeTab(2)">24년 3회차</button>
    </div>

    <div class="quiz-container">
        <div class="header">
            <span id="progress">문제 1 / 20</span>
            <div id="score-badge" style="font-weight:bold; color:#4a90e2;">맞힌 개수: 0</div>
        </div>

        <div id="quiz-content">
            <div id="question" class="question-text"></div>
            <div id="options" class="options-grid"></div>
        </div>

        <div class="feedback-area" id="feedback">
            <div id="feedback-msg" style="font-weight:bold; margin-bottom:10px;"></div>
            <button class="next-btn" onclick="nextQuestion()">다음 문제 ▶</button>
        </div>
    </div>

    <script>
        // 데이터 부분은 생략 없이 그대로 유지합니다.
        const quizData = [
            // 24년 1회차
            [
                { q: "01. 가공전선로의 지지물에 하중에 가하여지는 경우에 그 하중을 받는 지지물의 기초 안전율은 얼마 이상이어야 하는가? (단, 이상 시 상정 하중은 무관)", a: 2, o: ["1.5", "2.0", "2.5", "3.0"] },
                { q: "02. 주택의 전기저장장치의 시설에 관한 사항이다. 다음 중 틀린 것은?", a: 3, o: ["주택의 옥내전로의 대지전압은 직류 600[V] 이하.", "충전부분은 노출되지 않도록 시설하여야 한다.", "모든 부품은 충분한 내수성을 확보하여야 한다.", "전선은 공칭단면적 2.5[mm²] 이상의 연동선"] },
                { q: "03. 전개된 장소에서 저압 옥상전선로의 시설기준으로 적합하지 않은 것은?", a: 1, o: ["전선은 지름 2.0[mm]의 경동선을 사용하였다.", "전선 지지점 간의 거리를 15[m]로 하였다.", "전선은 절연전선을 사용하였다.", "저압 절연전선과 그 저압 옥상 전선을 시설하는 조영재와의 이격거리를 2[m]로 하였다."] },
                { q: "04. 시가지에 시설하는 22.9[kV] 특고압 가공전선으로 경동연선을 사용하려면 단면적은 몇 [mm²] 이상이어야 하는가?", a: 1, o: ["55", "100", "150", "200"] },
                { q: "05. 진열장 내의 배선으로 사용전압 400[V] 이하에 사용하는 코드 또는 캡타이어 케이블의 최소 단면적은 몇 [mm²]인가?", a: 3, o: ["1.25", "1.0", "0.75", "0.5"] },
                { q: "06. 과부하 보호장치는 분기점으로부터 몇 [m]까지 이동하여 설치할 수 있는가? (단, 단락의 위험과 화재 및 인체에 대한 위험성이 최소화되도록 시설된 경우)", a: 3, o: ["1", "2", "3", "5"] },
                { q: "07. 사용전압이 60[kV] 이하인 경우 전화선로의 길이 12[km] 마다 유도전류는 몇 [μA]를 넘지 않도록 하여야 하는가?", a: 2, o: ["1", "2", "3", "5"] },
                { q: "08. 발전소에서 계측장치를 시설하지 않아도 되는 것은?", a: 1, o: ["발전기의 회전수 및 주파수", "발전기의 고정자 및 베어링 온도", "주요 변압기의 전압 및 전류 또는 전력", "특고압용 변압기의 온도"] },
                { q: "09. \"제2차 접근상태\"라 함은 가공 전선이 다른 시설물과 접근하는 경우에 그 가공전선이 다른 시설물의 위쪽 또는 옆쪽에서 수평거리로 몇 [m] 미만인 곳에 시설되는 상태를 말하는가?", a: 4, o: ["1.2", "2", "2.5", "3.0"] },
                { q: "10. 사용전압이 15[kV] 미만인 특고압 가공전선과 그 지지물·완금류·지주 또는 지선 사이의 이격거리는 몇 [m] 이상이어야 하는가?", a: 1, o: ["0.15", "0.2", "0.25", "0.3"] },
                { q: "11. 전기철도차량이 전차선로와 접촉한 상태에서 견인력을 끄고 보조전력을 가동한 상태로 정지해 있는 경우, 가공 전차선로의 유효전력이 200[kW] 이상일 경우 총 역률은 몇보다는 작아서는 안되는가?", a: 4, o: ["0.9", "0.7", "0.6", "0.8"] },
                { q: "12. 저압 옥측전선로 공사방법으로 틀린 것은?", a: 3, o: ["애자공사", "금속관공사", "금속제 가요전선관공사", "합성수지관공사"] },
                { q: "13. 발전소, 변전소, 개폐소 이에 준하는 곳, 전기사용 장소 상호간의 전선 및 이를 지지하거나 수용하는 시설물을 무엇이라 하는가?", a: 3, o: ["급전소", "송전선로", "전선로", "개폐소"] },
                { q: "14. 제2종 특고압 보안공사의 기준으로 틀린 것은?", a: 3, o: ["특고압 가공전선은 연선일 것", "지지물로 사용하는 목주의 풍압하중에 대한 안전율은 2 이상일 것", "지지물이 A종 철주일 경우 그 경간은 150[m] 이하일 것", "지지물이 목주일 경우 그 경간은 100[m] 이하일 것"] },
                { q: "15. 금속덕트공사에 의한 저압 옥내배선에서 금속덕트에 넣은 전선의 단면적의 합계는 일반적으로 덕트 내부 단면적의 몇 [%] 이하여야 하는가? (단, 전광표시 장치 기타 이와 유사한 장치 또는 제어회로 등의 배선만을 넣는 경우에는 제외)", a: 1, o: ["20", "30", "40", "50"] },
                { q: "16. 조상설비 내부고장, 과전류 또는 과전압이 생긴 경우 자동적으로 차단되는 장치를 해야 하는 분로리액터의 최소 뱅크용량은 몇 [kVA]인가?", a: 4, o: ["10,000", "12,000", "500", "15,000"] },
                { q: "17. 특고압 변전소에 울타리·담 등을 시설하고자 할 때 울타리·담 등의 높이는 몇 [m] 이상이어야 하는가?", a: 2, o: ["1", "2", "5", "6"] },
                { q: "18. 전차선로의 직류방식에서 급전 전압으로 알맞지 않은 것은?", a: 4, o: ["지속성 최대전압 900[V], 1,800[V]", "공칭전압 750[V], 1,500[V]", "지속성 최소전압 500[V], 900[V]", "장기 과전압 950[V], 1,950[V]"] },
                { q: "19. 가공전선로와 지중 전선로가 접속되는 곳에 반드시 설치되어야 하는 기구는?", a: 3, o: ["분로리액터", "전력용 콘덴서", "피뢰기", "동기조상기"] },
                { q: "20. 다음 고압 가공전선에 대한 사항으로 잘못된 것은?", a: 3, o: ["철도 또는 궤도를 횡단하는 경우에는 레일면상 6.5 [m] 이상으로 시설한다.", "고압 가공전선을 수면 상에 시설하는 경우에는 전선의 수면 상의 높이가 선박의 항해 등에 위험을 주지 않도록 유지하여야 한다.", "횡단보도교의 위에 시설하는 경우에는 그 노면상 5[m] 이상으로 시설한다.", "고압 가공전선로를 빙설이 많은 지방에 시설하는 경우에는 전선의 적설상의 높이를 사람 또는 차량의 통행 등에 위험을 주지 않도록 유지하여야 한다."] }
            ],
            // 24년 2회차
            [
                { q: "01. 한국전기설비규정에서 정하고 있는 대지전압이 300[V] 이하인 주택의 옥내전로의 시설에 대한 설명이다. 틀린 것은?", a: 3, o: ["전기기계기구 및 옥내의 전선은 사람이 쉽게 접촉할 우려가 없도록 시설하여야 한다.", "백열전등의 전구소켓은 키나 그 밖의 점멸기구가 없는 것이어야 한다.", "주택의 전로 인입구에 시설하는 누전차단기를 자연재해위험개선지구의 지정 등에서 지정되어진 지구 안의 지하주택에 시설하는 경우에는 침수시 위험의 우려가 없도록 지하에 시설하여야 한다.", "주택의 전로 인입구에는 감전보호용 누전차단기를 시설하여야 한다."] },
                { q: "02. 154[kV] 가공전선로를 시가지에 시설하는 경우 지락 또는 단락이 생기면 몇 초 이내에 자동적으로 차단하는 장치를 시설하는가?", a: 1, o: ["1", "2", "3", "5"] },
                { q: "03. 전기철도차량의 집전장치와 접촉하여 전력을 공급하기 위한 전선을 무엇이라 하는가?", a: 2, o: ["조가선", "전차선", "급전선", "귀선"] },
                { q: "04. 한국전기설비규정에서 정하고 있는 합성수지관 공사에 의한 저압 옥내배선 시설방법에 대한 설명 중 틀린 것은?", a: 4, o: ["절연전선을 사용하였다.", "합성수지관 안에 접속점이 없도록 시설하였다.", "기계적 충격을 받을 우려가 없도록 시설하였다.", "이중천정 안에 시설하였다."] },
                { q: "05. 고압 보안공사에서 지지물이 철탑인 경우 지지물의 경간은 몇 [m] 이하이어야 하는가? (단, 단주가 아닌 경우이다.)", a: 4, o: ["100", "150", "600", "400"] },
                { q: "06. 100[kV] 미만의 특고압 가공전선을 시가지에 경동연선으로 시설할 경우 단면적은 몇 [mm²] 이상을 사용하여야 하는가?", a: 1, o: ["55", "100", "150", "200"] },
                { q: "07. 변전소에서 154[kV]급 변압기를 옥외에 시설할 때 울타리 높이와 충전부분까지 거리의 합계는 몇 [m] 이상인가?", a: 3, o: ["5", "5.5", "6", "6.5"] },
                { q: "08. 지중 전선로를 직접 매설식에 의하여 시설할 때, 중량물의 압력을 받을 우려가 있는 장소에 저압 또는 고압의 지중전선을 견고한 트라프 기타 방호물에 넣지 않고도 부설할 수 있는 케이블은?", a: 2, o: ["PVC 외장 케이블", "콤바인덕트 케이블", "염화비닐 절연 케이블", "폴리에틸렌 외장 케이블"] },
                { q: "09. 저압 옥내전로의 인입구에 가까운 곳으로서 쉽게 개폐할 수 있는 곳에 개폐기를 시설하여야 한다. 그러나 사용전압이 400[V] 이하인 옥내전로로서 다른 옥내전로에 접속하는 길이가 몇 [m] 이하인 경우에는 개폐기를 생략할 수 있는가?(단, 정격전류가 16[A] 이하인 과전류 차단기 또는 정격전류가 16[A]를 초과하고 20[A] 이하인 배선용차단기로 보호되고 있는 것에 한한다.)", a: 1, o: ["15", "20", "25", "30"] },
                { q: "10. 라이팅덕트공사에 의한 저압 옥내배선 공사시설 기준으로 틀린 것은?", a: 3, o: ["덕트의 끝부분은 막을 것", "덕트는 조영재에 견고하게 붙일 것", "덕트는 조영재를 관통하여 시설할 것", "덕트의 지지점 간의 거리는 2[m] 이하로 할 것"] },
                { q: "11. 발전소 등의 부지조성을 위해 산지를 전용할 경우 평균 경사도는 몇 도 이하이어야 하는가?", a: 4, o: ["10", "15", "20", "25"] },
                { q: "12. 고압 및 특고압 전로 중에 시설하는 과전류차단기의 설명 중 틀린 것은?", a: 3, o: ["과전류차단기는 그 동작에 따라 그 개폐상태를 표시하는 장치가 되어있는 것이어야 한다.", "전로에 단락이 생긴 경우에는 동작하는 과전류 차단기는 이것을 시설하는 곳을 통과하는 단락전류를 차단하는 능력을 가지는 것이어야 한다.", "포장퓨즈는 정격전류의 1.3배의 전류에 견디고 또한 2배의 전류로 60분 안에 용단되는 것이어야 한다.", "비포장퓨즈는 정격전류의 1.25배의 전류에 견디고 또한 2배의 전류로 2분 안에 용단되는 것이어야 한다."] },
                { q: "13. 전기욕기에 전기를 공급하는 전원장치의 2차측 전로의 사용전압은 몇 [V] 이하인가?", a: 2, o: ["6", "10", "12", "15"] },
                { q: "14. 한국전기설비규정에서 정하고 있는 고압 옥내배선의 시설로서 알맞은 것은?", a: 4, o: ["애자공사에 의해서 공칭단면적 2.5[mm²] 이상의 연동선을 사용하였다.", "애자공사에 의한 전선의 지지점 간의 거리를 2[m] 이하로 시설하였다.", "금속관공사로 시설", "케이블배선 또는 케이블트레이 배선으로 시설"] },
                { q: "15. 가공전선로의 지선이 도로를 횡단하여 시설되는 경우 지표상의 높이는 몇 [m] 이상이어야 하는가?", a: 2, o: ["3", "5", "6", "6.5"] },
                { q: "16. 주택용 배선차단기의 B형은 순시트립범위가 정격전류(In)의 몇 배인가?", a: 1, o: ["3In 초과 ~ 5In 이하", "5In 초과 ~ 10In 이하", "10In 초과 ~ 20In 이하", "1In 초과 ~ 3In 이하"] },
                { q: "17. 한국전기설비규정에서 정하고 있는 풍력발전설비에 대한 설명 중 틀린 것은?", a: 1, o: ["접지설비는 풍력발전설비 타워기초를 이용한 공통접지공사를 하여야 한다.", "설비 사이의 전위차가 없도록 등전위본딩을 한다.", "피뢰설비로 풍력터빈에 설치하는 인하도선은 쉽게 부식되지 않는 금속선으로서 뇌격 전류를 안전하게 흘릴 수 있는 충분한 굵기여야 한다.", "제어기기의 피뢰설비는 광케이블 및 포토커플러를 적용하여야 한다."] },

                { q: "19. 한국전기설비규정에서 정하고 있는 전기철도의 전기 공급방식에 대한 설명 중 틀린 것은?", a: 3, o: ["수전선로는 지형적 여건 등 시설 조건에 따라 가공 또는 지중 방식으로 시설하며, 비상시를 대비하여 예비선로를 확보하여야 한다.", "공칭전압은 교류 3상 22.9[kV], 154[kV], 345[kV]이다.", "직류방식의 전차선로에서 비지속성 최고전압은 지속시간이 10분 이하로 예상되는 전압의 최고값으로 한다.", "교류방식의 전차선로에서 비지속성 최저전압은 지속시간이 2분 이하로 예상되는 전압의 최저값으로 한다."] },
                { q: "20. 아래 설명은 한국전기설비규정에서 정하고 있는 용어 중 무엇을 의미하는가?\n[발전기·전동기·연료전지·태양전지·해양에너지발전설비·전기저장장치 그 밖의 기계 기구(비상용 예비전원을 얻을 목적으로 시설하는 것 및 휴대용 발전기를 제외한다)를 시설하여 전기를 생산(원자력, 화력, 신재생에너지 등을 이용하여 전기를 발생시키는 것과 양수 발전·전기저장장치와 같이 전기를 다른 에너지로 변환하여 저장 후 전기를 공급하는 것)하는 곳을 말한다.]", a: 1, o: ["발전소", "변전소", "개폐소", "급전소"] }

            // 24년 3회차
            [
                { q: "01. 저압 옥내배선 중 사용하는 전선이 반드시 절연전선이 아니라도 상관없는 공사는?", a: 3, o: ["합성수지관공사", "금속관공사", "버스덕트공사", "플로어덕트공사"] },
                { q: "02. 주택 등 저압 수용 장소에서 고정 전기설비에 TN-C-S 접지방식으로 접지공사 시 중성선 겸용 보호도체(PEN)를 알루미늄으로 사용할 경우 단면적은 몇 [mm²] 이상이어야 하는가?", a: 4, o: ["2.5", "6", "10", "16"] },
                { q: "03. 아크로부터 화재의 발생 우려가 없도록 제한되어 있는 35[kV] 이하인 특고압용 차단기 등의 동작시에 아크가 발생하는 기구는 목재의 벽 또는 천장 등 가연성 구조물 등으로부터 몇 [m] 이상 이격하여 시설하여야 하는가? \n", a: 1, o: ["1", "1.5", "2", "2.5"] },
                { q: "04. 직류 전기철도 시스템이 매설 배관 또는 케이블과 인접할 경우 누설전류를 피하기 위해 최대한 이격시켜야 하며, 주행레일과 최소 몇 [m] 이상의 거리를 유지하여야 하는가? \n", a: 2, o: ["0.5", "1", "2", "3"] },
                { q: "05. 사용전압이 22.9[kV]인 특고압 가공전선과 그 지지물·완금류·지주 또는 지선 사이의 이격거리는 몇 [cm] 이상이어야 하는가?", a: 2, o: ["15", "20", "25", "30"] },
                { q: "06. 철도 또는 궤도를 횡단하는 저고압 가공전선의 높이는 레일면 상 몇 [m] 이상이어야 하는가?", a: 2, o: ["5.5", "6.5", "7.5", "8.5"] },
                { q: "07. 사용전압 300[V] 지중전선과 지중약전류전선 사이에 내화성 격벽을 설치한다면 이격 거리는 몇 [cm] 이하인가?", a: 1, o: ["30", "50", "60", "100"] },
                { q: "08. 400[V] 이하 저압 보안공사에 사용되는 경동선은 지름 최소 몇 [mm] 이상인가?", a: 3, o: ["2.0", "2.6", "4.0", "5.0"] },
                { q: "09. 66[kV] 가공전선과 6[kV] 가공전선을 동일 지지물에 병가하는 경우 특고압 가공전선은 케이블인 경우를 제외하고는 단면적이 몇 [mm²] 이상인 경동연선을 사용하여야 하는가?", a: 2, o: ["22", "50", "55", "100"] },
                { q: "10. 지중 전선로의 매설방법이 아닌 것은?", a: 2, o: ["관로식", "압착식", "암거식", "직접 매설식"] },
                { q: "11. 고압 가공전선을 시가지외에 시설할 때 사용되는 경동선의 최소 지름은 몇 [mm]인가?", a: 3, o: ["2.6", "3.2", "4.0", "5.0"] },
                { q: "12. 귀선로에 대한 설명으로 틀린 것은?", a: 1, o: ["나전선을 적용하여 가공식으로 가설을 원칙으로 한다.", "사고 및 지락 시에도 충분한 허용전류용량을 가져야 한다.", "비절연보호도체, 매설접지도체, 레일 등으로 구성하여 단권변압기 중성점과 공통접지에 접속한다. \n", "비절연보호도체 위치는 통신유도장해 경감을 고려하여 결정한다."] },
                { q: "13. 공칭전압 750[V] 직류시스템 전차선로 충전부와 차량 간 동적 최소 절연이격거리는 몇 [mm]인가?", a: 1, o: ["25", "100", "170", "270"] },
                { q: "14. 154[kV] 가공 송전선과 식물과의 이격거리는 일반적인 경우 몇 [m] 이상인가?", a: 2, o: ["2.8", "3.2", "3.6", "4.2"] },
                { q: "15. 저압 옥내배선이 약전류전선 등 또는 수관·가스관이나 이와 유사한 것과 접근하거나 교차하는 경우에 저압 옥내배선을 애자공사에 의하여 시설하는 때에는 저압 옥내배선과 약전류전선 등 또는 수관·가스관이나 이와 유사한 것과의 이격거리는 몇 [m] 이상이어야 하는가? (단, 전선을 절연전선으로 사용하였다.)", a: 1, o: ["0.1", "0.3", "0.5", "0.7"] },
                { q: "16. 22,900[V] 3상 4선식 다중접지식 전로의 대지 사이 절연내력시험전압은 몇 [V]인가?", a: 1, o: ["21,068", "25,229", "28,752", "32,510"] },
                { q: "17. 교통신호등 제어장치 2차측 배선의 최대사용전압은 몇 [V] 이하인가?", a: 3, o: ["150", "250", "300", "400"] },
                { q: "18. 저압가공전선과 건조물 상부 조영재와의 옆쪽 이격거리는 몇 [m] 이상인가? (사람 접촉 우려 있음, 케이블 아님)", a: 3, o: ["0.4", "0.8", "1.2", "2.0"] },
                { q: "19. 교류계통에서 일반적으로 사용되며 일반인이 사용하는 콘센트는 정격전류 몇 [A] 이하일 때 누전차단기에 의한 추가적 보호를 하여야 하는가? \n", a: 2, o: ["16", "20", "32", "50"] },
                { q: "20. 급전선에 대한 설명으로 틀린 것은?", a: 1, o: ["급전선은 단권변압기 중성점과 공통접지에 접속한다.", "가공식은 전차선의 높이 이상으로 전차선로 지지물에 병가하며, 나전선의 접속은 직선접속을 원칙으로 한다.", "선상승강장, 인도교, 과선교 또는 교량 하부 등에 설치할 때에는 최소 절연이격거리 이상을 확보하여야 한다.", "신설 터널 내 급전선을 가공으로 설계할 경우 지지물의 취부는 C찬넬 또는 매입전을 이용하여 고정하여야 한다. \n"] }
            ]
        ];

        let currentTab = 0;
        let currentIdx = 0;
        let correctCount = 0;
        let isAnswered = false;

        function changeTab(tabIdx) {
            currentTab = tabIdx;
            currentIdx = 0;
            correctCount = 0;
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((t, i) => t.classList.toggle('active', i === tabIdx));
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            document.getElementById('feedback').style.display = 'none';
            const progress = document.getElementById('progress');
            const questionBox = document.getElementById('question');
            const optionsBox = document.getElementById('options');
            const scoreBadge = document.getElementById('score-badge');

            const currentData = quizData[currentTab][currentIdx];
            progress.textContent = `문제 ${currentIdx + 1} / 20`;
            scoreBadge.textContent = `맞힌 개수: ${correctCount}`;
            questionBox.textContent = currentData.q;
            
            optionsBox.innerHTML = '';
            currentData.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${i + 1}. ${opt}`;
                btn.onclick = () => checkAnswer(i + 1, btn);
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            if (isAnswered) return;
            isAnswered = true;

            const correct = quizData[currentTab][currentIdx].a;
            const feedback = document.getElementById('feedback');
            const msg = document.getElementById('feedback-msg');

            if (selected === correct) {
                btn.classList.add('correct');
                msg.textContent = "⭕ 정답입니다!";
                msg.style.color = "#28a745";
                correctCount++;
            } else {
                btn.classList.add('wrong');
                msg.textContent = `❌ 틀렸습니다. 정답은 ${correct}번입니다.`;
                msg.style.color = "#dc3545";
                const buttons = document.querySelectorAll('.option-btn');
                buttons[correct - 1].classList.add('correct');
            }
            feedback.style.display = 'block';
        }

        function nextQuestion() {
            if (currentIdx < 19) {
                currentIdx++;
                loadQuestion();
            } else {
                alert(`회차 종료! 총 ${correctCount}문제를 맞히셨습니다.`);
                currentIdx = 0;
                correctCount = 0;
                loadQuestion();
            }
        }

        // 브라우저가 화면을 모두 로드한 뒤 함수를 실행하도록 보장합니다.
        window.onload = function() {
            loadQuestion();
        };
    </script>
