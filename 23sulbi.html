<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2023년 전기설비기술기준 퀴즈</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 탭 스타일 */
        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e9ecef;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            font-weight: bold;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #4a90e2;
            color: white;
        }

        .quiz-container {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .question-text {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1em;
            color: #495057;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover { background-color: #e2e6ea; }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }

        .feedback-area {
            margin-top: 20px;
            display: none;
            padding: 15px;
            border-radius: 10px;
            background: #f1f3f5;
        }
        .next-btn {
            margin-top: 15px;
            padding: 12px 40px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="tab-container">
        <button class="tab-btn active" onclick="changeTab(0)">23년 1회차</button>
        <button class="tab-btn" onclick="changeTab(1)">23년 2회차</button>
        <button class="tab-btn" onclick="changeTab(2)">23년 3회차</button>
    </div>

    <div class="quiz-container">
        <div class="header">
            <span id="progress">문제 1 / 20</span>
            <div id="score-badge" style="font-weight:bold; color:#4a90e2;">맞힌 개수: 0</div>
        </div>

        <div id="quiz-content">
            <div id="question" class="question-text"></div>
            <div id="options" class="options-grid"></div>
        </div>

        <div class="feedback-area" id="feedback">
            <div id="feedback-msg" style="font-weight:bold; margin-bottom:10px;"></div>
            <button class="next-btn" onclick="nextQuestion()">다음 문제 ▶</button>
        </div>
    </div>

    <script>
        const quizData = [
            // 23년 1회차
            [
                { q: "01. 공통접지공사 적용 시 선도체의 단면적이 16 [mm²]인 경우 보호도체(PE)에 적합한 단면적은?\n(단, 보호도체의 재질이 선도체와 같은 경우)", a: 4, o: ["4", "6", "10", "16"] },
                { q: "02. 저압 옥상전선로에 시설하는 전선은 조영재에 견고하게 붙인 지지주 또는 지지대에 절연성·난연성 및 내수성이 있는 애자를 사용하여 지지하고 또한 지지점 간의 거리는 몇 [m] 이하로 하여야 하는가?", a: 2, o: ["10", "15", "20", "25"] },
                { q: "03. 전기철도 변전소의 급전용변압기는 교류 전기철도의 경우 어떤 변압기 적용을 원칙으로 하는가?", a: 2, o: ["3상 정류기용 변압기", "3상 스코트결선 변압기", "3상 흡상변압기", "3상 단권변압기"] },
                { q: "04. 전기철도차량에 전력을 공급하는 전차선의 가선 방식에 포함되지 않는 것은?", a: 4, o: ["가공방식", "강체방식", "제3레일방식", "지중조가선방식"] },
                { q: "05. 사용전압이 170[kV] 이하의 변압기를 시설하는 변전소로서 기술원이 상주하여 감시하지는 않으나 수시로 순회하는 경우, 기술원이 상주하는 장소에 경보장치를 시설하지 않아도 되는 경우는?", a: 3, o: ["조상기는 내부에 고장이 생긴 경우", "제어회로의 전압이 현저히 저하한 경우", "운전조작에 필요한 차단기가 수동적으로 차단한 후 재폐로한 경우", "옥내변전소에 화재가 발생한 경우"] },
                { q: "06. 전기철도의 차량과 전차선로나 충전부 비절연 부분 간의 공기 절연이격거리는 단상 교류의 공칭 전압이 25,000[V]인 경우 동적인 상태에서 몇 [mm] 이상 확보하여야 하는가?", a: 3, o: ["25 [mm]", "100 [mm]", "170 [mm]", "270 [mm]"] },
                { q: "07. 배전선로의 지지물에 시설하는 전주외등에서 기구의 인출선은 도체 단면적이 몇 [mm²] 이상이어야 하는가?", a: 2, o: ["1.5", "0.75", "2.5", "4.0"] },
                { q: "08. 전동기의 과부하 보호장치의 시설에서 전원측 전로에 시설한 배선용차단기의 정격전류가 몇 [A] 이하의 것이면 이 전로에 접속하는 단상전동기에는 과부하 보호장치를 생략할 수 있는가?\n(단, 전동기의 정격 출력이 0.2[kW] 이하인 것을 제외한다)", a: 2, o: ["16", "20", "30", "50"] },
                { q: "09. 최대사용전압 6.6[kV]인 전로의 절연내력을 시험할 때 시험전압을 연속하여 몇 분간 가하였을 때 이에 견디어야 하는가?", a: 2, o: ["5분", "10분", "15분", "30분"] },
                { q: "10. 가공 전선로의 지지물에 시설하는 지선의 시설 기준으로 틀린 것은?", a: 2, o: ["지선의 안전율은 2.5 이상일 것", "소선은 최소 2가닥 이상의 연선일 것", "도로를 횡단하여 시설하는 지선의 높이는 일반적으로 지표상 5[m] 이상으로 할 것", "지중부분 및 지표상 30[cm]까지의 부분은 아연도금을 한 철봉 등 부식하기 어려운 재료를 사용할 것"] },
                { q: "11. 수중조명등에 전기를 공급하기 위해서는 절연변압기를 사용하고, 그 사용전압은 절연변압기 1차측과 2차측을 각각 몇 [V] 이하로 하여야 하는가?", a: 4, o: ["300, 300", "300, 150", "400, 300", "400, 150"] },
                { q: "12. 가공전선로의 지지물에 하중이 가하여지는 경우에 그 하중을 받는 지지물의 기초 안전율은 얼마 이상이어야 하는가?\n(단, 이상 시 상정하중은 무관)", a: 2, o: ["1.5", "2.0", "2.5", "3.0"] },
                { q: "13. 사람이 상시 통행하는 터널 안의 배선(전기기계기구 안의 배선, 관등회로의 배선, 소세력 회로의 전선은 제외)은 사용전압이 저압인 것에 한하고 공칭단면적은 몇 [mm²]의 연동선을 사용하여야 하는가?\n(단, 옥외용 비닐절연전선 및 인입용 비닐절연전선은 제외한다.)", a: 2, o: ["1.5", "2.5", "4.0", "0.75"] },
                { q: "14. 애자공사에 의한 고압 옥내배선에 사용되는 연동선의 최소 굵기는 몇 [mm²]인가?", a: 3, o: ["2.5", "4", "6", "8"] },
                { q: "15. 최대사용전압이 10[kV]인 중성점 비접지식 전로의 절연내력시험전압은 몇 [kV]인가?", a: 2, o: ["10", "12.5", "9.2", "15"] },
                { q: "16. 과전류차단기로 저압전로에 사용하는 주택용 배선용차단기를 조명, 콘센트, 소형 전동기 등에 설치할 때 차단기 정격전류에 대해서 순시트립 전류의 범위로 알맞은 것은?", a: 3, o: ["1In 초과 ~ 3In 이하", "3In 초과 ~ 5In 이하", "5In 초과 ~ 10In 이하", "10In 초과 ~ 20In 이하"] },
                { q: "17. 케이블트렌치에 의한 옥내배선 공사를 다음과 같이 시공하였다. 옳지 않은 것은?", a: 4, o: ["케이블트렌치의 바닥 또는 측면에는 전선의 하중에 충분히 견디는 구조로 할 것.", "케이블트렌치의 뚜껑, 받침대 등 금속재는 내식성의 재료이거나 방식처리를 할 것.", "케이블트렌치는 외부에서 고형물이 들어가지 않도록 IP2X 이상으로 시설할 것.", "케이블트렌치 굴곡부 안쪽의 반경은 통과하는 전선의 허용곡률반경 이하로 할 것."] },
                { q: "18. 2차측 개방전압이 7[kV] 이하인 절연변압기를 사용하고 절연변압기의 1차측 전로를 자동적으로 차단하는 보호장치를 시설한 경우의 전격살충기는 전격자가 지표상 또는 마루 위 몇 [m] 이상의 높이에 시설하여야 하는가?", a: 2, o: ["1.5", "1.8", "2.5", "3.5"] },
                { q: "19. 전력보안 가공통신선을 조가선에 시설할 경우 조가선의 단면적은 몇 [mm²] 이상의 아연도강선을 사용하여야 하는가?", a: 2, o: ["22", "38", "16", "6"] },
                { q: "20. 고압 지중전선이 지중 약전류전선 등과 접근하거나 교차하는 경우에 상호의 이격거리가 몇 [cm] 이하인 때에는 두 전선이 직접 접촉하지 아니하도록 조치하여야 하는가?", a: 3, o: ["15", "20", "30", "40"] }
            ],
            // 23년 2회차
            [
                { q: "01. 철도, 궤도 또는 자동차도의 전용터널 안의 터널 내 전선로의 시설방법으로 틀린 것은?", a: 1, o: ["저압전선으로 지름 2.0[mm]의 경동선을 사용하였다.", "고압전선은 케이블공사로 하였다.", "저압전선을 애자공사에 의하여 시설하고 이를 궤조면 또는 노면상 2.5[m] 이상으로 하였다.", "저압전선을 가요전선관 공사에 의하여 시설하였다."] },
                { q: "02. 수소냉각식의 발전기, 조상기는 발전기 안 또는 조상기 안의 수소의 순도가 몇 [%] 이하로 저하한 경우에 이를 경보하는 장치를 시설하여야 하는가?", a: 4, o: ["70", "75", "80", "85"] },
                { q: "03. 지중전선로를 직접 매설식에 의하여 시설하는 경우에 차량 등 중량물의 압력을 받을 우려가 있는 장소에는 매설 깊이를 몇 [m] 이상으로 하여야 하는가?", a: 3, o: ["0.6", "0.8", "1.0", "1.2"] },
                { q: "04. 고압가공전선과 약전류전선이 접근하여 시설될 때 전선과 약전류전선과의 수평이격거리는 몇 [cm] 이상이어야 하는가?\n(단, 가공전선에는 케이블을 사용하지 않는다고 한다.)", a: 3, o: ["40", "60", "80", "100"] },
                { q: "05. 저압 옥상전선로에 시설하는 전선은 인장강도 2.30[kN] 이상의 것 또는 지름이 몇 [mm] 이상의 경동선이어야 하는가?", a: 3, o: ["1.6", "2.0", "2.6", "3.2"] },
                { q: "06. 단상 교류의 공칭전압이 25,000[V]인 전차선로의 차량과 전차선로나 충전부 비절연 부분간의 공기 절연이격거리는 정적인 상태일 때 몇 [mm] 이상 확보하여야 하는가?", a: 3, o: ["100[mm]", "150[mm]", "270[mm]", "170[mm]"] },
                { q: "07. 사무실 건물의 조명설비에 사용되는 백열전등 또는 방전등에 전기를 공급하는 옥내전로의 대지전압은 몇 [V] 이하이어야 하는가?", a: 2, o: ["250", "300", "350", "400"] },
                { q: "08. 다음 중 욕실 등 인체가 물에 젖어있는 상태에서 물을 사용하는 장소에 콘센트를 시설하는 경우에 적합한 누전차단기는?", a: 2, o: ["정격감도전류 15[mA] 이하, 동작시간 0.03초 이하의 전압동작형 누전차단기", "정격감도전류 15[mA] 이하, 동작시간 0.03초 이하의 전류동작형 누전차단기", "정격감도전류 15[mA] 이하, 동작시간 0.3초 이하의 전압동작형 누전차단기", "정격감도전류 15[mA] 이하, 동작시간 0.3초 이하의 전류동작형 누전차단기"] },
                { q: "09. 사용전압이 22.9[kV]인 특고압 가공전선이 도로를 횡단하는 경우, 지표상 높이는 최소 몇 [m] 이상 인가?", a: 4, o: ["4.5", "5", "5.5", "6"] },
                { q: "10. 사용전압이 400[V] 이하인 경우의 저압보안공사에 전선으로 경동선을 사용할 경우 지름은 몇 [mm] 이상인가?", a: 3, o: ["2.6", "3.5", "4.0", "5.0"] },
                { q: "11. 옥내에 시설하는 사용전압 400[V] 초과 1,000[V] 이하인 전개된 장소로서 건조한 장소가 아닌 기타의 장소의 관등회로 배선공사로서 적합한 것은?", a: 1, o: ["애자공사", "합성수지몰드공사", "금속몰드공사", "금속덕트공사"] },
                { q: "12. 지중 또는 수중에 시설되는 금속체의 부식 방지를 위한 전기부식 방지 회로의 사용전압은 직류 몇 [V] 이하로 하여야 하는가?", a: 3, o: ["24 [V]", "48 [V]", "60 [V]", "100 [V]"] },
                { q: "13. 저압 옥측전선로의 공사에서 목조 조영물에 시설이 가능한 공사는?", a: 2, o: ["금속피복을 한 케이블공사", "합성수지관공사", "금속관공사", "버스덕트공사"] },
                { q: "14. 시가지에 시설하는 22.9[kV] 특고압 가공전선으로 경동연선을 사용하려면 단면적은 몇 [mm²] 이상이어야 하는가?", a: 1, o: ["55", "100", "150", "200"] },
                { q: "15. 특고압 가공전선로의 지지물 중 전선로의 지지물 양쪽의 경간의 차가 큰 곳에 사용하는 철탑은?", a: 1, o: ["내장형 철탑", "인류형 철탑", "보강형 철탑", "각도형 철탑"] },
                { q: "16. 고압 지중전선이 지중 약전류전선 등과 접근하거나 교차하는 경우에 상호의 이격거리가 몇 [cm] 이하인 때에는 두 전선이 직접 접촉하지 아니하도록 조치하여야 하는가?", a: 3, o: ["15", "20", "30", "40"] },
                { q: "17. 점검할 수 없는 은폐된 장소로 400[V] 이하의 건조한 장소의 옥내배선 공사로 알맞은 것은?", a: 2, o: ["금속덕트공사", "플로어덕트공사", "라이팅덕트공사", "버스덕트공사"] },
                { q: "18. 저압 절연전선으로 「전기용품 및 생활용품 안전관리법」의 적용을 받는 것 이외에 KS에 적합한 것으로서 사용할 수 없는 것은?", a: 2, o: ["450/750[V] 비닐절연전선", "450/750[V] 폴리 캡타이어 절연전선", "450/750[V] 저독성 난연 폴리올레핀절연전선", "450/750[V] 고무절연전선"] },

        let currentTab = 0;
        let currentIdx = 0;
        let correctCount = 0;
        let isAnswered = false;

        function changeTab(tabIdx) {
            currentTab = tabIdx;
            currentIdx = 0;
            correctCount = 0;
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach((t, i) => t.classList.toggle('active', i === tabIdx));
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            document.getElementById('feedback').style.display = 'none';
            const progress = document.getElementById('progress');
            const questionBox = document.getElementById('question');
            const optionsBox = document.getElementById('options');
            const scoreBadge = document.getElementById('score-badge');

            const currentData = quizData[currentTab][currentIdx];
            progress.textContent = `문제 ${currentIdx + 1} / 20`;
            scoreBadge.textContent = `맞힌 개수: ${correctCount}`;
            questionBox.textContent = currentData.q;
            
            optionsBox.innerHTML = '';
            currentData.o.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${i + 1}. ${opt}`;
                btn.onclick = () => checkAnswer(i + 1, btn);
                optionsBox.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            if (isAnswered) return;
            isAnswered = true;

            const correct = quizData[currentTab][currentIdx].a;
            const feedback = document.getElementById('feedback');
            const msg = document.getElementById('feedback-msg');

            if (selected === correct) {
                btn.classList.add('correct');
                msg.textContent = "⭕ 정답입니다!";
                msg.style.color = "#28a745";
                correctCount++;
            } else {
                btn.classList.add('wrong');
                msg.textContent = `❌ 틀렸습니다. 정답은 ${correct}번입니다.`;
                msg.style.color = "#dc3545";
                
                const buttons = document.querySelectorAll('.option-btn');
                buttons[correct - 1].classList.add('correct');
            }
            feedback.style.display = 'block';
        }

        function nextQuestion() {
            if (currentIdx < 19) {
                currentIdx++;
                loadQuestion();
            } else {
                alert(`회차 종료! 총 ${correctCount}문제를 맞히셨습니다.`);
                currentIdx = 0;
                correctCount = 0;
                loadQuestion();
            }
        }

        loadQuestion();
    </script>
